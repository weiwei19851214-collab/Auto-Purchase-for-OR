<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenRouter 充值执行原型</title>
    <link rel="stylesheet" href="./prototype.css" />
  </head>
  <body data-page="execution">
    <div class="app-shell">
      <header class="toolbar" aria-label="执行页工具栏">
        <div class="toolbar-title">
          <p class="caption">OpenRouter 充值</p>
          <h1>执行工作</h1>
        </div>
        <div class="toolbar-actions">
          <span class="page-note">关闭页面不影响任务</span>
          <a class="secondary-link" href="./index.html">返回准备页</a>
          <button class="secondary-button" id="contrastButton" type="button" aria-pressed="false">高对比</button>
        </div>
      </header>

      <main class="execution-layout" aria-label="执行监控">
        <section class="run-summary" aria-labelledby="runTitle">
          <div>
            <p class="caption" id="runCaption">模拟 run</p>
            <h2 id="runTitle">等待 run 数据</h2>
          </div>
          <div class="summary-grid" aria-label="执行汇总">
            <div class="summary-card">
              <strong id="summaryDone">0</strong>
              <span>完成</span>
            </div>
            <div class="summary-card">
              <strong id="summaryRunning">0</strong>
              <span>执行中</span>
            </div>
            <div class="summary-card">
              <strong id="summaryBlocked">0</strong>
              <span>阻断/失败</span>
            </div>
            <div class="summary-card">
              <strong id="summaryElapsed">0s</strong>
              <span>耗时</span>
            </div>
          </div>
          <div class="progress-bar" aria-label="整体进度">
            <span id="progressFill"></span>
          </div>
          <span class="sr-only" id="progressLabel" aria-live="polite">整体进度 0%</span>
        </section>

        <section class="task-board" aria-labelledby="taskBoardTitle">
          <div class="section-heading">
            <div>
              <p class="caption">子任务状态</p>
              <h2 id="taskBoardTitle">逐行执行</h2>
            </div>
            <div class="table-actions">
              <button class="secondary-button" id="refreshButton" type="button">刷新</button>
              <button class="secondary-button" id="restartButton" type="button">重新模拟</button>
            </div>
          </div>
          <div class="execution-table-wrap" tabindex="0" aria-label="可横向滚动的子任务表">
            <table class="execution-table">
              <thead>
                <tr>
                  <th scope="col">状态</th>
                  <th scope="col">OPOM</th>
                  <th scope="col">账号</th>
                  <th scope="col">阶段</th>
                  <th scope="col">耗时</th>
                  <th scope="col">消息</th>
                  <th scope="col">模式</th>
                </tr>
              </thead>
              <tbody id="executionBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="./execution.js"></script>
  </body>
</html>
